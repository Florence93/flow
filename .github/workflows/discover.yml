name: discover-boards

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Discover boards
        working-directory: scraper
        run: python ats_scraper.py --discover-only --refresh-boards
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit updated board list
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add scraper/discovered_boards.json
          git diff --cached --quiet || git commit -m "chore: refresh discovered boards [skip ci]"
          git push