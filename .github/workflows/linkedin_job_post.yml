name: LinkedIn job poster

on:
  schedule:
    # GitHub cron is always UTC. Lagos = UTC+1, so subtract 1 hour.
    - cron: "7 7 * * *"    # 8:07am Lagos
    - cron: "7 8 * * *"    # 9:07am Lagos
    - cron: "7 9 * * *"    # 10:07am Lagos
  workflow_dispatch: {}

concurrency:
  group: linkedin-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write LinkedIn token
        env:
          LINKEDIN_TOKEN_JSON: ${{ secrets.LINKEDIN_TOKEN_JSON }}
        run: printf '%s' "$LINKEDIN_TOKEN_JSON" > linkedin_token.json

      - name: Run poster
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
        run: python post_linkedin_from_supabase.py